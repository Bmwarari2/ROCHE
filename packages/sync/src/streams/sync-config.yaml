# PowerSync sync streams (edition 3): what each device may hold offline (master prompt 5.3, 17.2).
#
# Logical replication bypasses Postgres row-level security, so these queries ARE the access control
# for offline data. Every stream is pinned to the tenant in the signed token, and
# packages/sync/test/streams.test.ts proves no cross-tenant or out-of-scope row reaches a device.
#
# Token claims (minted by the API at POST /v1/sync/token, 15-minute expiry):
#   sub                   tenant_user id (auth.user_id())
#   tenant_id             the active tenant
#   location_ids          locations the user works at (location switcher)
#   Each family of streams follows the scope of the one read permission it serves, from the roles
#   and grants carrying that permission only (ADR-0071 and its review round 1, C-M1 and S-M1),
#   never where another role reaches further:
#     people (person, allergies)                      people.person.read and care.plan.read (a
#                                                     person syncs only with their care reference,
#                                                     so the phone never shows a resuscitation
#                                                     decision as not recorded; review round 2)
#     care (care reference, active plan details,       care.plan.read (the open tasks follow the
#           open tasks)                                round view's permission)
#     entries (recent notes, charts, marks, visits)    care.note.read
#     handover (handovers, items, notes, acknowledgements) care.handover.manage
#   <family>_location_ids locations whose people sync in full for that family: managers and nurses
#                         only; empty for care workers, who receive assigned people only
#   <family>_assigned     true when a role scoped to assigned people carries every one of the
#                         family's permissions: only then do the people the user is assigned to sync
#                         for that family (the assigned_* streams). Missing or false syncs none
#                         (fails closed). A break-glass record never syncs
#   entries_write_location_ids, entries_write_assigned, entries_write_person_ids
#                         where the phone may record (care.note.write), with the people the user is
#                         assigned to when that reaches them (at most 100, else absent); read by no
#                         stream, only by the phone, which offers recording only there, per person
#                         for assigned clients (review rounds 2 and 3, C2-M3 and C3-M2)
#   offline_days          UTC calendar days (yyyy-mm-dd) of the offline window: tomorrow, today and
#                         the days before it, `mobile.offline_window_days` in all, read by the API
#                         from the rate table when it mints the token (offlineWindowDays in
#                         ../client/window.ts). The device cannot change it: connection parameters
#                         are never read for the window (security review S1). A token without it
#                         receives no point-of-care entries, open tasks or handovers (fails closed).
#   offline_blocks        the ten-day blocks (yyyy-mm-d) of offline_days: the assigned streams key
#                         by person and block, not by person and day (ADR-0134)
#   handover_assigned_location_ids  the homes where the member's assigned people live: the
#                         handovers a limited reader may open there, per home and block
#   care_own_tasks        whether tasks about nobody given to the member sync (care.plan.read
#                         reaching assigned people); never turned off by the whole-home cover
#
# Buckets per connection (ADR-0134; HZ-002, HZ-138). PowerSync refuses a connection over its
# limits (infra/powersync/powersync.yaml), so no stream keys a home's rows by person: a home's
# entries, tasks and handover rows filter on columns of the row itself, which the database sets
# and moves with the person (migration 0146): `sync_location_id`, the person's home while they
# receive care, else none (so L1 below still holds); a task, its own home while its person receives
# care; on a handover's rows its home and `shift_end`, and on items and notes `person_location_id`
# (the person's home now) and `at_home`. Assigned rows key by person and ten-day block. A family's
# assigned streams are left off when its whole-home claims already carry everyone the member is
# assigned to (tasks about nobody given to the member keep their own claim, care_own_tasks); the
# API estimates a token's buckets and refuses one above the limit by name (sync_scope_too_large).
# packages/sync/test/bucket-budget.test.ts measures the worst cases.
#
# Assignments end by soft delete (deleted_at) when valid_to passes or when revoked, because sync
# streams cannot read the clock; the short token expiry bounds how long a device keeps syncing.
#
# Connection parameters: none are read. Whatever a device sends in connect({ params }) is ignored,
# so neither scope nor the offline window can be widened from the device.
#
# Care record streams (care.md section 6), each in two scopes like the people streams above:
#   *_care_reference      care profile, the active care plan, active risk assessments, every
#                         validated-tool result (the device shows the latest per tool) and active
#                         advance care records: never evicted while the person is in scope
#   *_care_plan_details   sections and actions of the active plan only (no drafts, HZ-024)
#   *_recent_entries      notes, chart observations, body-map marks, activities and visits whose
#                         event day is in the offline window; queries in one stream share buckets
#                         (one per person or location and day), which keeps the bucket count low
#   *_open_tasks          open tasks due on a day of the offline window (the round)
#   *_handovers           the handovers of shifts ending on a day of the window, with what the reader
#                         may see of them
#
# Every location-scope stream (people, allergies and the care record) carries people receiving care
# only, active, on leave or in hospital: once a person is an enquiry, discharged, has died or is
# archived, they and their care record leave managers' devices (security review S8 and L1).
# Assigned people leave with their assignment.
#
# Medicines (medicines.md section 13.8; Phase 2 slice 68; ADR-0130), in the two person scopes of
# the care streams, for medicines.emar.administer:
#   meds_location_ids     locations whose live people's medicines sync in full (managers, nurses)
#   meds_assigned         true when a role scoped to assigned people carries the permission; false
#                         or missing syncs none (fails closed)
#   meds_recent_days      UTC days of administrations recorded today, the 34 days before and tomorrow
#                         (medsRecentDays in ../client/window.ts: the last given of a monthly
#                         medicine, intervals and the 24-hour maximum): what the phone counts;
#                         the streams filter on meds_recent_blocks, its ten-day blocks
#   *_medicines           every MAR entry version not withdrawn or removed (a stopped or replaced
#                         one syncs, so a change for tomorrow never takes today's doses off the
#                         phone; the phone judges the times, ADR-0130), and the person's schedule
#                         times, dosing records and covert records not removed, whatever version
#                         they belong to (a filter on the version would need a subquery, which
#                         makes a bucket per version in the tenant; the phone shows only those of
#                         a version it holds; H-1425): priority 1, with the allergy streams,
#                         so a stop or an allergy reaches the phone first (HZ-002)
#   meds_recent_blocks    the ten-day blocks of meds_recent_days (at most eight), minted with it for
#                         the member's homes and assigned people alike; empty syncs none
#   *_medicine_administrations  administrations: at the token's homes, recorded in a
#                         meds_recent_blocks block, one bucket per home and block (the row's own
#                         sync_location_id, set and moved by the database: the person's home while
#                         they receive care; ADR-0134); for assigned people, recorded in a
#                         meds_recent_blocks block, one bucket per person and block. Never one per
#                         person and day: that went past PowerSync's buckets per connection
#   my_medicines_competence     the member's own medicines competence sign-offs and withdrawals
# No document, reconciliation, error, review, stock or controlled drug register row syncs. The dm+d
# subset comes from the API (GET /v1/medicines/device-subset), not a stream (ADR-0130).
# The member's own shifts and clock (scheduling.md section 18; Phase 2 slice 71):
#   shift_days            UTC calendar days of the member's own shifts, two days back and eight ahead
#                         (shiftWindowDays in ../client/window.ts), minted by the API only for holders
#                         of scheduling.timesheet.self: empty otherwise, and then no shift or clock
#                         event syncs (fails closed). Only the member's own rows sync, by
#                         auth.user_id(): never a colleague's shift or clock event.
#   my_shifts             the member's published, uncancelled shifts on a published assignment
#   my_clock_events       the member's own clock events
# No lone-worker table syncs: logical replication bypasses row-level security, and a synced event
# would show a duress press for what it is. The phone reads its session through the API instead.

config:
  edition: 3

streams:
  my_locations:
    auto_subscribe: true
    query: >-
      SELECT id, tenant_id, name, regulator_location_id AS cqc_location_id, nation
      FROM location
      WHERE tenant_id = auth.parameter('tenant_id')
        AND id IN auth.parameter('location_ids')

  # The services each of the member's homes runs, and nothing about anyone: the phone applies the
  # same controlled drugs witness policy as the API (medicines.md rule 27; HZ-116), offering "no one
  # is here to witness" only where every active service allows it.
  my_location_services:
    auto_subscribe: true
    query: >-
      SELECT id, tenant_id, location_id, service_type, status
      FROM service AS "location_service"
      WHERE tenant_id = auth.parameter('tenant_id')
        AND location_id IN auth.parameter('location_ids')
        AND deleted_at IS NULL

  assigned_people:
    auto_subscribe: true
    query: >-
      SELECT person.id, person.tenant_id, person.location_id, person.status, person.given_name,
             person.family_name, person.preferred_name, person.date_of_birth, person.nhs_number,
             person.room_label, person.photo_document_id, person.communication_needs,
             person.allergy_status, person.is_sample, person.updated_at, person.version
      FROM person, person_assignment
      WHERE person.id = person_assignment.person_id
        AND person.tenant_id = auth.parameter('tenant_id')
        AND person_assignment.tenant_id = auth.parameter('tenant_id')
        AND person_assignment.tenant_user_id = auth.user_id()
        AND auth.parameter('people_assigned') = true
        AND person_assignment.deleted_at IS NULL

  assigned_allergies:
    auto_subscribe: true
    # An allergy change reaches the phone first whenever it syncs (HZ-002).
    priority: 1
    query: >-
      SELECT allergy.id, allergy.tenant_id, allergy.person_id, allergy.substance, allergy.reaction,
             allergy.severity, allergy.status, allergy.recorded_at
      FROM allergy, person_assignment
      WHERE allergy.person_id = person_assignment.person_id
        AND allergy.tenant_id = auth.parameter('tenant_id')
        AND person_assignment.tenant_id = auth.parameter('tenant_id')
        AND person_assignment.tenant_user_id = auth.user_id()
        AND auth.parameter('people_assigned') = true
        AND person_assignment.deleted_at IS NULL

  location_people:
    auto_subscribe: true
    query: >-
      SELECT id, tenant_id, location_id, status, given_name, family_name, preferred_name,
             date_of_birth, nhs_number, room_label, photo_document_id, communication_needs,
             allergy_status, is_sample, updated_at, version
      FROM person
      WHERE tenant_id = auth.parameter('tenant_id')
        AND location_id IN auth.parameter('people_location_ids')
        AND (status = 'active' OR status = 'on_leave' OR status = 'in_hospital')

  location_allergies:
    auto_subscribe: true
    # An allergy change reaches the phone first whenever it syncs (HZ-002).
    priority: 1
    query: >-
      SELECT allergy.id, allergy.tenant_id, allergy.person_id, allergy.substance, allergy.reaction,
             allergy.severity, allergy.status, allergy.recorded_at
      FROM allergy, person
      WHERE allergy.person_id = person.id
        AND allergy.tenant_id = auth.parameter('tenant_id')
        AND person.tenant_id = auth.parameter('tenant_id')
        AND person.location_id IN auth.parameter('people_location_ids')
        AND (person.status = 'active' OR person.status = 'on_leave' OR person.status = 'in_hospital')

  # ----------------------------------------------------------------------------------------------
  # Care record: reference data (never evicted while the person is in scope)
  # ----------------------------------------------------------------------------------------------

  assigned_care_reference:
    auto_subscribe: true
    queries:
      - >-
        SELECT person_care_profile.id, person_care_profile.tenant_id,
               person_care_profile.person_id, person_care_profile.iddsi_food_level,
               person_care_profile.iddsi_drink_level, person_care_profile.iddsi_advised_by,
               person_care_profile.iddsi_changed_at, person_care_profile.fluid_target_ml,
               person_care_profile.spo2_scale2, person_care_profile.skin_risk,
               person_care_profile.updated_at, person_care_profile.version
        FROM person_care_profile, person_assignment
        WHERE person_care_profile.person_id = person_assignment.person_id
          AND person_care_profile.tenant_id = auth.parameter('tenant_id')
          AND person_care_profile.deleted_at IS NULL
          AND person_assignment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_user_id = auth.user_id()
          AND auth.parameter('care_assigned') = true
          AND person_assignment.deleted_at IS NULL
      - >-
        SELECT care_plan.id, care_plan.tenant_id, care_plan.person_id, care_plan.location_id,
               care_plan.status, care_plan.published_version, care_plan.summary,
               care_plan.review_due_on, care_plan.published_at, care_plan.sign_off_kind,
               care_plan.signed_off_at, care_plan.updated_at, care_plan.version
        FROM care_plan, person_assignment
        WHERE care_plan.person_id = person_assignment.person_id
          AND care_plan.tenant_id = auth.parameter('tenant_id')
          AND care_plan.status = 'active'
          AND care_plan.deleted_at IS NULL
          AND person_assignment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_user_id = auth.user_id()
          AND auth.parameter('care_assigned') = true
          AND person_assignment.deleted_at IS NULL
      - >-
        SELECT risk_assessment.id, risk_assessment.tenant_id, risk_assessment.person_id,
               risk_assessment.template_key, risk_assessment.template_version,
               risk_assessment.hazard, risk_assessment.who_at_risk, risk_assessment.risk_rating,
               risk_assessment.risk_band, risk_assessment.residual_rating,
               risk_assessment.residual_band, risk_assessment.controls,
               risk_assessment.positive_risk_statement, risk_assessment.person_views,
               risk_assessment.assessed_on, risk_assessment.review_due_on, risk_assessment.status,
               risk_assessment.updated_at, risk_assessment.version
        FROM risk_assessment, person_assignment
        WHERE risk_assessment.person_id = person_assignment.person_id
          AND risk_assessment.tenant_id = auth.parameter('tenant_id')
          AND risk_assessment.status = 'active'
          AND risk_assessment.deleted_at IS NULL
          AND person_assignment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_user_id = auth.user_id()
          AND auth.parameter('care_assigned') = true
          AND person_assignment.deleted_at IS NULL
      - >-
        SELECT assessment.id, assessment.tenant_id, assessment.person_id, assessment.location_id,
               assessment.tool_key, assessment.tool_version, assessment.score, assessment.band,
               assessment.occurred_at, assessment.next_due_on, assessment.supersedes_id,
               assessment.correction_reason, assessment.late_entry
        FROM assessment, person_assignment
        WHERE assessment.person_id = person_assignment.person_id
          AND assessment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_user_id = auth.user_id()
          AND auth.parameter('care_assigned') = true
          AND person_assignment.deleted_at IS NULL
      - >-
        SELECT advance_care_record.id, advance_care_record.tenant_id,
               advance_care_record.person_id, advance_care_record.kind, advance_care_record.status,
               advance_care_record.cpr_decision, advance_care_record.clinician_name,
               advance_care_record.clinician_role, advance_care_record.completed_on,
               advance_care_record.review_due_on, advance_care_record.details,
               advance_care_record.updated_at, advance_care_record.version
        FROM advance_care_record, person_assignment
        WHERE advance_care_record.person_id = person_assignment.person_id
          AND advance_care_record.tenant_id = auth.parameter('tenant_id')
          AND advance_care_record.status = 'active'
          AND advance_care_record.deleted_at IS NULL
          AND person_assignment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_user_id = auth.user_id()
          AND auth.parameter('care_assigned') = true
          AND person_assignment.deleted_at IS NULL

  location_care_reference:
    auto_subscribe: true
    queries:
      - >-
        SELECT person_care_profile.id, person_care_profile.tenant_id,
               person_care_profile.person_id, person_care_profile.iddsi_food_level,
               person_care_profile.iddsi_drink_level, person_care_profile.iddsi_advised_by,
               person_care_profile.iddsi_changed_at, person_care_profile.fluid_target_ml,
               person_care_profile.spo2_scale2, person_care_profile.skin_risk,
               person_care_profile.updated_at, person_care_profile.version
        FROM person_care_profile, person
        WHERE person_care_profile.person_id = person.id
          AND person_care_profile.tenant_id = auth.parameter('tenant_id')
          AND person_care_profile.deleted_at IS NULL
          AND person.tenant_id = auth.parameter('tenant_id')
          AND person.location_id IN auth.parameter('care_location_ids')
          AND (person.status = 'active' OR person.status = 'on_leave' OR person.status = 'in_hospital')
      - >-
        SELECT care_plan.id, care_plan.tenant_id, care_plan.person_id, care_plan.location_id,
               care_plan.status, care_plan.published_version, care_plan.summary,
               care_plan.review_due_on, care_plan.published_at, care_plan.sign_off_kind,
               care_plan.signed_off_at, care_plan.updated_at, care_plan.version
        FROM care_plan, person
        WHERE care_plan.person_id = person.id
          AND care_plan.tenant_id = auth.parameter('tenant_id')
          AND care_plan.status = 'active'
          AND care_plan.deleted_at IS NULL
          AND person.tenant_id = auth.parameter('tenant_id')
          AND person.location_id IN auth.parameter('care_location_ids')
          AND (person.status = 'active' OR person.status = 'on_leave' OR person.status = 'in_hospital')
      - >-
        SELECT risk_assessment.id, risk_assessment.tenant_id, risk_assessment.person_id,
               risk_assessment.template_key, risk_assessment.template_version,
               risk_assessment.hazard, risk_assessment.who_at_risk, risk_assessment.risk_rating,
               risk_assessment.risk_band, risk_assessment.residual_rating,
               risk_assessment.residual_band, risk_assessment.controls,
               risk_assessment.positive_risk_statement, risk_assessment.person_views,
               risk_assessment.assessed_on, risk_assessment.review_due_on, risk_assessment.status,
               risk_assessment.updated_at, risk_assessment.version
        FROM risk_assessment, person
        WHERE risk_assessment.person_id = person.id
          AND risk_assessment.tenant_id = auth.parameter('tenant_id')
          AND risk_assessment.status = 'active'
          AND risk_assessment.deleted_at IS NULL
          AND person.tenant_id = auth.parameter('tenant_id')
          AND person.location_id IN auth.parameter('care_location_ids')
          AND (person.status = 'active' OR person.status = 'on_leave' OR person.status = 'in_hospital')
      - >-
        SELECT assessment.id, assessment.tenant_id, assessment.person_id, assessment.location_id,
               assessment.tool_key, assessment.tool_version, assessment.score, assessment.band,
               assessment.occurred_at, assessment.next_due_on, assessment.supersedes_id,
               assessment.correction_reason, assessment.late_entry
        FROM assessment, person
        WHERE assessment.person_id = person.id
          AND assessment.tenant_id = auth.parameter('tenant_id')
          AND person.tenant_id = auth.parameter('tenant_id')
          AND person.location_id IN auth.parameter('care_location_ids')
          AND (person.status = 'active' OR person.status = 'on_leave' OR person.status = 'in_hospital')
      - >-
        SELECT advance_care_record.id, advance_care_record.tenant_id,
               advance_care_record.person_id, advance_care_record.kind, advance_care_record.status,
               advance_care_record.cpr_decision, advance_care_record.clinician_name,
               advance_care_record.clinician_role, advance_care_record.completed_on,
               advance_care_record.review_due_on, advance_care_record.details,
               advance_care_record.updated_at, advance_care_record.version
        FROM advance_care_record, person
        WHERE advance_care_record.person_id = person.id
          AND advance_care_record.tenant_id = auth.parameter('tenant_id')
          AND advance_care_record.status = 'active'
          AND advance_care_record.deleted_at IS NULL
          AND person.tenant_id = auth.parameter('tenant_id')
          AND person.location_id IN auth.parameter('care_location_ids')
          AND (person.status = 'active' OR person.status = 'on_leave' OR person.status = 'in_hospital')

  # ----------------------------------------------------------------------------------------------
  # Care record: sections and actions of the active care plan
  # ----------------------------------------------------------------------------------------------

  assigned_care_plan_details:
    auto_subscribe: true
    queries:
      - >-
        SELECT care_plan_section.id, care_plan_section.tenant_id, care_plan_section.person_id,
               care_plan_section.plan_id, care_plan_section.domain, care_plan_section.need,
               care_plan_section.outcome, care_plan_section.strengths,
               care_plan_section.contingency, care_plan_section.updated_at,
               care_plan_section.version
        FROM care_plan_section, care_plan, person_assignment
        WHERE care_plan_section.plan_id = care_plan.id
          AND care_plan.person_id = person_assignment.person_id
          AND care_plan_section.tenant_id = auth.parameter('tenant_id')
          AND care_plan_section.deleted_at IS NULL
          AND care_plan.tenant_id = auth.parameter('tenant_id')
          AND care_plan.status = 'active'
          AND care_plan.deleted_at IS NULL
          AND person_assignment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_user_id = auth.user_id()
          AND auth.parameter('care_assigned') = true
          AND person_assignment.deleted_at IS NULL
      - >-
        SELECT care_plan_action.id, care_plan_action.tenant_id, care_plan_action.person_id,
               care_plan_action.plan_id, care_plan_action.section_id, care_plan_action.action,
               care_plan_action.role_key, care_plan_action.when_text,
               care_plan_action.recurrence, care_plan_action.risk_assessment_id,
               care_plan_action.updated_at, care_plan_action.version
        FROM care_plan_action, care_plan, person_assignment
        WHERE care_plan_action.plan_id = care_plan.id
          AND care_plan.person_id = person_assignment.person_id
          AND care_plan_action.tenant_id = auth.parameter('tenant_id')
          AND care_plan_action.deleted_at IS NULL
          AND care_plan.tenant_id = auth.parameter('tenant_id')
          AND care_plan.status = 'active'
          AND care_plan.deleted_at IS NULL
          AND person_assignment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_user_id = auth.user_id()
          AND auth.parameter('care_assigned') = true
          AND person_assignment.deleted_at IS NULL

  location_care_plan_details:
    auto_subscribe: true
    queries:
      - >-
        SELECT care_plan_section.id, care_plan_section.tenant_id, care_plan_section.person_id,
               care_plan_section.plan_id, care_plan_section.domain, care_plan_section.need,
               care_plan_section.outcome, care_plan_section.strengths,
               care_plan_section.contingency, care_plan_section.updated_at,
               care_plan_section.version
        FROM care_plan_section, care_plan, person
        WHERE care_plan_section.plan_id = care_plan.id
          AND care_plan.person_id = person.id
          AND care_plan_section.tenant_id = auth.parameter('tenant_id')
          AND care_plan_section.deleted_at IS NULL
          AND care_plan.tenant_id = auth.parameter('tenant_id')
          AND care_plan.status = 'active'
          AND care_plan.deleted_at IS NULL
          AND person.tenant_id = auth.parameter('tenant_id')
          AND person.location_id IN auth.parameter('care_location_ids')
          AND (person.status = 'active' OR person.status = 'on_leave' OR person.status = 'in_hospital')
      - >-
        SELECT care_plan_action.id, care_plan_action.tenant_id, care_plan_action.person_id,
               care_plan_action.plan_id, care_plan_action.section_id, care_plan_action.action,
               care_plan_action.role_key, care_plan_action.when_text,
               care_plan_action.recurrence, care_plan_action.risk_assessment_id,
               care_plan_action.updated_at, care_plan_action.version
        FROM care_plan_action, care_plan, person
        WHERE care_plan_action.plan_id = care_plan.id
          AND care_plan.person_id = person.id
          AND care_plan_action.tenant_id = auth.parameter('tenant_id')
          AND care_plan_action.deleted_at IS NULL
          AND care_plan.tenant_id = auth.parameter('tenant_id')
          AND care_plan.status = 'active'
          AND care_plan.deleted_at IS NULL
          AND person.tenant_id = auth.parameter('tenant_id')
          AND person.location_id IN auth.parameter('care_location_ids')
          AND (person.status = 'active' OR person.status = 'on_leave' OR person.status = 'in_hospital')

  # ----------------------------------------------------------------------------------------------
  # Care record: point-of-care entries in the offline window (append-only, written offline)
  # ----------------------------------------------------------------------------------------------

  assigned_recent_entries:
    auto_subscribe: true
    queries:
      - >-
        SELECT care_note.id, care_note.tenant_id, care_note.person_id, care_note.location_id,
