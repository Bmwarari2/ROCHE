  # ----------------------------------------------------------------------------------------------
  # The round: open tasks due on a day of the offline window, as the round view shows them
  # (GET /v1/locations/{id}/round, care.plan.read, under app.task_visible): a task about a person
  # with that person, a task about nobody at a location the reader sees whole, and a task about
  # nobody given to the reader. A task done, skipped or cancelled leaves the device; an unfinished
  # task due before the window is on the web round and in the handover, not on the phone (HZ-028).
  # `from_earlier_plan` is the round view's "From an earlier plan" notice, kept on the task by the
  # database (migration 0071; HZ-024), so the phone needs neither the plan nor the series.
  # ----------------------------------------------------------------------------------------------

  assigned_open_tasks:
    auto_subscribe: true
    queries:
      - >-
        SELECT task.id, task.tenant_id, task.series_id, task.location_id, task.person_id,
               task.kind, task.title, task.required_permission, task.source_type, task.source_id,
               task.assignee_tenant_user_id, task.assignee_role_key, task.due_at,
               task.window_start, task.window_end, task.priority, task.evidence_required,
               task.status, task.restore_code, task.from_earlier_plan, task.escalation_level,
               task.updated_at,
               task.version
        FROM task, person_assignment
        WHERE task.person_id = person_assignment.person_id
          AND task.tenant_id = auth.parameter('tenant_id')
          AND (task.status = 'open' OR task.status = 'in_progress')
          AND task.deleted_at IS NULL
          AND substring(task.due_at, 1, 9) IN auth.parameter('offline_blocks')
          AND person_assignment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_user_id = auth.user_id()
          AND auth.parameter('care_assigned') = true
          AND person_assignment.deleted_at IS NULL
      - >-
        SELECT task.id, task.tenant_id, task.series_id, task.location_id, task.person_id,
               task.kind, task.title, task.required_permission, task.source_type, task.source_id,
               task.assignee_tenant_user_id, task.assignee_role_key, task.due_at,
               task.window_start, task.window_end, task.priority, task.evidence_required,
               task.status, task.restore_code, task.from_earlier_plan, task.escalation_level,
               task.updated_at,
               task.version
        FROM task
        WHERE task.tenant_id = auth.parameter('tenant_id')
          AND task.person_id IS NULL
          AND task.assignee_tenant_user_id = auth.user_id()
          AND (task.status = 'open' OR task.status = 'in_progress')
          AND task.deleted_at IS NULL
          AND substring(task.due_at, 1, 9) IN auth.parameter('offline_blocks')
          AND auth.parameter('care_own_tasks') = true

  location_open_tasks:
    auto_subscribe: true
    queries:
      - >-
        SELECT task.id, task.tenant_id, task.series_id, task.location_id, task.person_id,
               task.kind, task.title, task.required_permission, task.source_type, task.source_id,
               task.assignee_tenant_user_id, task.assignee_role_key, task.due_at,
               task.window_start, task.window_end, task.priority, task.evidence_required,
               task.status, task.restore_code, task.from_earlier_plan, task.escalation_level,
               task.updated_at,
               task.version
        FROM task
        WHERE task.tenant_id = auth.parameter('tenant_id')
          AND task.sync_location_id IN auth.parameter('care_location_ids')
          AND (task.status = 'open' OR task.status = 'in_progress')
          AND task.deleted_at IS NULL
          AND substring(task.due_at, 1, 10) IN auth.parameter('offline_days')

  # ----------------------------------------------------------------------------------------------
  # The shift handover: the handovers compiled for shifts that end on a day of the offline window,
  # as the API's handover views show them (care.handover.manage, under row-level security on
  # handover, handover_item, handover_note and handover_acknowledgement; HZ-011, HZ-018). A shift
  # whose handover nobody has compiled yet has no row: staff compile it on request, the worker
  # refreshes an open one every five minutes and compiles and locks each shift once it has ended,
  # so `locked_at` empty means not final.
  #
  # A reader who sees a location's handovers whole (`handover_location_ids`) receives every item
  # and note there about the people at their locations or about nobody. A reader limited to the
  # people assigned to them (`handover_assigned`) receives the handovers they may open (where one
  # of those people lives, as `app.handover_location_visible`), and in them only the items and
  # notes about those people and the notes on the whole handover; never an item about nobody or a
  # note on one. A reader with both sees, in the handovers they see whole, the items and notes
  # about the people assigned to them who have since moved elsewhere, as the API shows them. Every reader receives their own acknowledgements, with the keys of the items they
  # acknowledged, in `handover_acknowledgement`; a whole reader also receives who acknowledged
  # (`handover_staff_acknowledgement`: who and when, never the keys, which name the people and
  # what happened to them, and which the API never returns). No refresh time or version is sent:
  # the API shows those to whole readers only, and one row cannot differ by reader. Items and
  # notes about a person carry no status filter, unlike the people streams, because row-level
  # security has none: a death or a discharge in the shift is what the incoming shift must be told,
  # and the phone acknowledges a handover only over the items the server would show (its seen
  # token, refused otherwise).
  # ----------------------------------------------------------------------------------------------

  assigned_handovers:
    auto_subscribe: true
    queries:
      - >-
        SELECT handover.id, handover.tenant_id, handover.location_id, handover.shift_name,
               handover.shift_start, handover.shift_end, handover.compiled_at,
               handover.locked_at
        FROM handover
        WHERE handover.tenant_id = auth.parameter('tenant_id')
          AND handover.location_id IN auth.parameter('handover_assigned_location_ids')
          AND auth.parameter('handover_assigned') = true
          AND handover.deleted_at IS NULL
          AND substring(handover.shift_end, 1, 9) IN auth.parameter('offline_blocks')
      - >-
        SELECT handover_item.id, handover_item.tenant_id, handover_item.handover_id,
               handover_item.key AS item_key, handover_item.position, handover_item.kind,
               handover_item.person_id, handover_item.source_type, handover_item.source_id,
               handover_item.at, handover_item.late_addition, handover_item.added_at,
               handover_item.summary
        FROM handover_item, person_assignment
        WHERE handover_item.person_id = person_assignment.person_id
          AND handover_item.tenant_id = auth.parameter('tenant_id')
          AND handover_item.at_home = true
          AND substring(handover_item.shift_end, 1, 9) IN auth.parameter('offline_blocks')
          AND person_assignment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_user_id = auth.user_id()
          AND auth.parameter('handover_assigned') = true
          AND person_assignment.deleted_at IS NULL
      - >-
        SELECT handover_note.id, handover_note.tenant_id, handover_note.handover_id,
               handover_note.item_key, handover_note.person_id, handover_note.body,
               handover_note.created_at, handover_note.created_by
        FROM handover_note, person_assignment
        WHERE handover_note.person_id = person_assignment.person_id
          AND handover_note.tenant_id = auth.parameter('tenant_id')
          AND handover_note.at_home = true
          AND substring(handover_note.shift_end, 1, 9) IN auth.parameter('offline_blocks')
          AND person_assignment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_user_id = auth.user_id()
          AND auth.parameter('handover_assigned') = true
          AND person_assignment.deleted_at IS NULL
      - >-
        SELECT handover_note.id, handover_note.tenant_id, handover_note.handover_id,
               handover_note.item_key, handover_note.person_id, handover_note.body,
               handover_note.created_at, handover_note.created_by
        FROM handover_note
        WHERE handover_note.tenant_id = auth.parameter('tenant_id')
          AND handover_note.item_key IS NULL
          AND handover_note.person_id IS NULL
          AND handover_note.sync_location_id IN auth.parameter('handover_assigned_location_ids')
          AND auth.parameter('handover_assigned') = true
          AND substring(handover_note.shift_end, 1, 9) IN auth.parameter('offline_blocks')
      - >-
        SELECT handover_acknowledgement.id, handover_acknowledgement.tenant_id,
               handover_acknowledgement.handover_id, handover_acknowledgement.tenant_user_id,
               handover_acknowledgement.item_keys, handover_acknowledgement.acknowledged_at
        FROM handover_acknowledgement
        WHERE handover_acknowledgement.tenant_id = auth.parameter('tenant_id')
          AND handover_acknowledgement.tenant_user_id = auth.user_id()
          AND auth.parameter('handover_assigned') = true
          AND substring(handover_acknowledgement.shift_end, 1, 9) IN auth.parameter('offline_blocks')
      - >-
        SELECT handover_item.id, handover_item.tenant_id, handover_item.handover_id,
               handover_item.key AS item_key, handover_item.position, handover_item.kind,
               handover_item.person_id, handover_item.source_type, handover_item.source_id,
               handover_item.at, handover_item.late_addition, handover_item.added_at,
               handover_item.summary
        FROM handover_item, person_assignment
        WHERE handover_item.person_id = person_assignment.person_id
          AND handover_item.tenant_id = auth.parameter('tenant_id')
          AND handover_item.sync_location_id IN auth.parameter('handover_location_ids')
          AND substring(handover_item.shift_end, 1, 9) IN auth.parameter('offline_blocks')
          AND person_assignment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_user_id = auth.user_id()
          AND auth.parameter('handover_assigned') = true
          AND person_assignment.deleted_at IS NULL
      - >-
        SELECT handover_note.id, handover_note.tenant_id, handover_note.handover_id,
               handover_note.item_key, handover_note.person_id, handover_note.body,
               handover_note.created_at, handover_note.created_by
        FROM handover_note, person_assignment
        WHERE handover_note.person_id = person_assignment.person_id
          AND handover_note.tenant_id = auth.parameter('tenant_id')
          AND handover_note.sync_location_id IN auth.parameter('handover_location_ids')
          AND substring(handover_note.shift_end, 1, 9) IN auth.parameter('offline_blocks')
          AND person_assignment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_user_id = auth.user_id()
          AND auth.parameter('handover_assigned') = true
          AND person_assignment.deleted_at IS NULL

