  my_medicines_competence:
    auto_subscribe: true
    queries:
      - >-
        SELECT competence_sign_off.id, competence_sign_off.tenant_id, competence_sign_off.worker_id,
               competence_sign_off.competence, competence_sign_off.observed_on,
               competence_sign_off.valid_until
        FROM competence_sign_off
        WHERE competence_sign_off.tenant_id = auth.parameter('tenant_id')
          AND competence_sign_off.worker_id = auth.user_id()
          AND (competence_sign_off.competence = 'medicines_administration'
            OR competence_sign_off.competence = 'controlled_drugs'
            OR competence_sign_off.competence = 'insulin_administration'
            OR competence_sign_off.competence = 'epilepsy_rescue_medication')
      - >-
        SELECT competence_withdrawal.id, competence_withdrawal.tenant_id,
               competence_withdrawal.sign_off_id
        FROM competence_withdrawal, competence_sign_off
        WHERE competence_withdrawal.sign_off_id = competence_sign_off.id
          AND competence_withdrawal.tenant_id = auth.parameter('tenant_id')
          AND competence_sign_off.tenant_id = auth.parameter('tenant_id')
          AND competence_sign_off.worker_id = auth.user_id()
          AND (competence_sign_off.competence = 'medicines_administration'
            OR competence_sign_off.competence = 'controlled_drugs'
            OR competence_sign_off.competence = 'insulin_administration'
            OR competence_sign_off.competence = 'epilepsy_rescue_medication')
