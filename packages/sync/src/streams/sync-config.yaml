          AND substring(handover_acknowledgement.shift_end, 1, 9) IN auth.parameter('offline_blocks')
      - >-
        SELECT "handover_staff_acknowledgement".id, "handover_staff_acknowledgement".tenant_id,
               "handover_staff_acknowledgement".handover_id,
               "handover_staff_acknowledgement".tenant_user_id,
               "handover_staff_acknowledgement".acknowledged_at
        FROM handover_acknowledgement AS "handover_staff_acknowledgement"
        WHERE "handover_staff_acknowledgement".tenant_id = auth.parameter('tenant_id')
          AND "handover_staff_acknowledgement".sync_location_id IN auth.parameter('handover_location_ids')
          AND substring("handover_staff_acknowledgement".shift_end, 1, 10) IN auth.parameter('offline_days')

  my_shifts:
    auto_subscribe: true
    query: >-
      SELECT shift.id, shift.tenant_id, shift.location_id, shift.label, shift.kind,
             shift.starts_at, shift.ends_at, shift.break_minutes, shift.changed_after_publish_at
      FROM shift, shift_assignment
      WHERE shift.id = shift_assignment.shift_id
        AND shift.tenant_id = auth.parameter('tenant_id')
        AND shift_assignment.tenant_id = auth.parameter('tenant_id')
        AND shift_assignment.worker_id = auth.user_id()
        AND shift_assignment.deleted_at IS NULL
        AND shift_assignment.published_at IS NOT NULL
        AND shift.deleted_at IS NULL
        AND shift.published_at IS NOT NULL
        AND substring(shift.starts_at, 1, 10) IN auth.parameter('shift_days')

  my_clock_events:
    auto_subscribe: true
    query: >-
      SELECT id, tenant_id, worker_id, kind, shift_id, location_id, device_time, recorded_at, flags
