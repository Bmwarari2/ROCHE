      WHERE tenant_id = auth.parameter('tenant_id')
        AND worker_id = auth.user_id()
        AND substring(device_time, 1, 10) IN auth.parameter('shift_days')

  assigned_medicines:
    auto_subscribe: true
    # A stopped medicine reaches the phone first whenever it syncs (HZ-002).
    priority: 1
    queries:
      - >-
        SELECT medication.id, medication.tenant_id, medication.person_id, medication.medicine_id,
                       medication.version, medication.replaces_id, medication.state,
                       medication.vmp_id, medication.amp_id, medication.product_name,
                       medication.route_code, medication.route_name, medication.directions,
                       medication.pattern_kind, medication.interval_days, medication.weekdays,
                       medication.interval_weeks, medication.anchor_on, medication.day_of_month,
                       medication.prn_dose, medication.tags, medication.minimum_interval_minutes,
                       medication.indication, medication.special_instructions, medication.starts_at,
                       medication.stops_at, medication.stop_effective_at, medication.cd_schedule,
                       medication.check_outcome, medication.updated_at, medication.prn_max_per_24h,
               medication.replaced_by_id, medication.replaced_from, medication.stop_at,
               medication.origin, medication.corrected_part_way_through,
               medication.earlier_doses_due_on, medication.earlier_doses_due_reason
        FROM medication, person_assignment
        WHERE medication.person_id = person_assignment.person_id
          AND medication.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_user_id = auth.user_id()
          AND auth.parameter('meds_assigned') = true
          AND person_assignment.deleted_at IS NULL
          AND medication.deleted_at IS NULL
          AND medication.state <> 'withdrawn'
      - >-
        SELECT medication_schedule.id, medication_schedule.tenant_id, medication_schedule.person_id,
                       medication_schedule.medication_id, medication_schedule.position,
                       medication_schedule.time, medication_schedule.dose_kind,
                       medication_schedule.quantity, medication_schedule.from_quantity,
                       medication_schedule.to_quantity, medication_schedule.unit_code,
                       medication_schedule.unit_name
        FROM medication_schedule, person_assignment
        WHERE medication_schedule.person_id = person_assignment.person_id
          AND medication_schedule.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_user_id = auth.user_id()
          AND auth.parameter('meds_assigned') = true
          AND person_assignment.deleted_at IS NULL
      - >-
        SELECT medication_dosing_record.id, medication_dosing_record.tenant_id,
                       medication_dosing_record.person_id, medication_dosing_record.medication_id,
                       medication_dosing_record.doses, medication_dosing_record.check_outcome,
                       medication_dosing_record.check_at, medication_dosing_record.recorded_at
        FROM medication_dosing_record, person_assignment
        WHERE medication_dosing_record.person_id = person_assignment.person_id
          AND medication_dosing_record.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_user_id = auth.user_id()
          AND auth.parameter('meds_assigned') = true
          AND person_assignment.deleted_at IS NULL
      - >-
        SELECT covert_medication_record.id, covert_medication_record.tenant_id,
                       covert_medication_record.person_id, covert_medication_record.medication_id,
                       covert_medication_record.medicine_id, covert_medication_record.method,
                       covert_medication_record.pharmacist_advice,
                       covert_medication_record.starts_on, covert_medication_record.review_on,
                       covert_medication_record.reviewed_on, covert_medication_record.ended_on,
                       covert_medication_record.version
        FROM covert_medication_record, person_assignment
        WHERE covert_medication_record.person_id = person_assignment.person_id
          AND covert_medication_record.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_id = auth.parameter('tenant_id')
          AND person_assignment.tenant_user_id = auth.user_id()
          AND auth.parameter('meds_assigned') = true
          AND person_assignment.deleted_at IS NULL
          AND covert_medication_record.deleted_at IS NULL

