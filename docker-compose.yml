# Harbour local development stack.
#
#   docker compose up -d                     postgres, powersync-storage, powersync, mailpit
#   docker compose --profile flagsmith up -d also runs self-hosted Flagsmith
#
# Values come from .env (copy .env.example); every variable has a local-only default so the
# stack also starts without one. Ports are bound to 127.0.0.1 so local databases are never
# exposed to the network. These defaults are for disposable local data only and never used
# in Google Cloud, where secrets live in Secret Manager (ADR-0098).
#
# Order of first start: `docker compose up -d postgres`, then `pnpm db:bootstrap` (as
# harbour_admin it creates the login roles and the harbour database) and `pnpm db:migrate`
# (migration 0002 creates the powersync publication), then start the API on port 4000 (it
# serves the JWKS PowerSync verifies tokens against). PowerSync restarts until then.

name: harbour

services:
  postgres:
    build:
      context: ./infra/docker/postgres
    image: harbour/postgres:17-local
    restart: unless-stopped
    # harbour_admin plays the RDS master user: the image makes it the superuser, and
    # `pnpm db:bootstrap` (DATABASE_ADMIN_URL) uses it to create the non-superuser roles
    # (harbour_owner, harbour_app, harbour_sync and others) and the harbour database.
    environment:
      POSTGRES_USER: harbour_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-harbour_admin_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbour_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # PowerSync bucket storage: its own Postgres, as in AWS (the sync-storage RDS instance).
  powersync-storage:
    image: postgres:17.11-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: powersync_storage
      POSTGRES_DB: powersync_storage
      POSTGRES_PASSWORD: ${POWERSYNC_STORAGE_PASSWORD:-powersync_storage_local}
    ports:
      - "127.0.0.1:${POWERSYNC_STORAGE_PORT:-5433}:5432"
    volumes:
      - powersync-storage-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powersync_storage -d powersync_storage"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  powersync:
    image: journeyapps/powersync-service:${POWERSYNC_VERSION:-1.26.1}
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    depends_on:
      postgres:
        condition: service_healthy
      powersync-storage:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_PORT: "8080"
      PS_DATA_SOURCE_HOST: postgres
      PS_DATA_SOURCE_PORT: "5432"
      PS_DATA_SOURCE_DATABASE: harbour
      PS_DATA_SOURCE_USER: harbour_sync
      PS_DATA_SOURCE_PASSWORD: ${HARBOUR_DB_PASSWORD_HARBOUR_SYNC:-harbour_sync_local}
      PS_DATA_SOURCE_SSLMODE: disable
      PS_STORAGE_HOST: powersync-storage
      PS_STORAGE_PORT: "5432"
      PS_STORAGE_DATABASE: powersync_storage
      PS_STORAGE_USER: powersync_storage
      PS_STORAGE_PASSWORD: ${POWERSYNC_STORAGE_PASSWORD:-powersync_storage_local}
      PS_STORAGE_SSLMODE: disable
      # The API (running on the host with `pnpm dev`) serves the keys PowerSync verifies
      # client JWTs against.
      PS_JWKS_URL: ${POWERSYNC_JWKS_URL:-http://host.docker.internal:4000/v1/sync/jwks}
      PS_JWT_AUDIENCE: ${SYNC_JWT_AUDIENCE:-harbour-powersync}
      PS_BLOCK_LOCAL_JWKS: "false"
      PS_API_TOKEN: ${POWERSYNC_API_TOKEN:-powersync_local_admin_token}
    volumes:
      - ./infra/powersync/powersync.yaml:/config/powersync.yaml:ro
      - ./packages/sync/src/streams/sync-config.yaml:/config/sync-config.yaml:ro
    ports:
      - "127.0.0.1:${POWERSYNC_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/probes/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Local SMTP server that catches every email; UI at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # Optional: self-hosted Flagsmith (OpenFeature provider). UI and API at http://localhost:8000.
  flagsmith-db:
    profiles: ["flagsmith"]
    image: postgres:17.11-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: flagsmith
      POSTGRES_DB: flagsmith
      POSTGRES_PASSWORD: ${FLAGSMITH_DB_PASSWORD:-flagsmith_local}
    volumes:
      - flagsmith-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagsmith -d flagsmith"]
      interval: 5s
      timeout: 5s
      retries: 20

  flagsmith:
    profiles: ["flagsmith"]
    image: flagsmith/flagsmith:${FLAGSMITH_VERSION:-2.280.0}
    restart: unless-stopped
    depends_on:
      flagsmith-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://flagsmith:${FLAGSMITH_DB_PASSWORD:-flagsmith_local}@flagsmith-db:5432/flagsmith
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECRET_KEY: ${FLAGSMITH_SECRET_KEY:-flagsmith_local_secret_key_not_for_real_use}
      ENVIRONMENT: local
      ENABLE_TELEMETRY: "false"
      ALLOW_ADMIN_INITIATION_VIA_CLI: "true"
    ports:
      - "127.0.0.1:${FLAGSMITH_PORT:-8000}:8000"

volumes:
  postgres-data:
  powersync-storage-data:
  flagsmith-data:
