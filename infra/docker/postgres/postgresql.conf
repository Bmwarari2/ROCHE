# Server configuration for the local Harbour Postgres image. Passed with
# `-c config_file=...`, so it applies to every start, including the temporary server the
# official entrypoint runs for init scripts (pgAudit must be preloaded before
# CREATE EXTENSION pgaudit can run).

# Base settings the official image would otherwise write with initdb.
listen_addresses = '*'
max_connections = 100
shared_buffers = 128MB
dynamic_shared_memory_type = posix
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, dmy'
default_text_search_config = 'pg_catalog.english'

include '/etc/postgresql/harbour.conf'
