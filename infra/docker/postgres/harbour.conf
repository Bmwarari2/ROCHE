# Harbour settings, mirroring the RDS parameter group in infra/modules/rds_postgres/main.tf.

# PowerSync replicates through a logical replication slot.
wal_level = logical
max_replication_slots = 10
max_wal_senders = 10
max_slot_wal_keep_size = 2048

# pgAudit: DDL, role and privilege changes, and writes. Reads are audited by the application
# in audit_event (section 5.5); bound parameter values are never logged.
shared_preload_libraries = 'pgaudit,pg_stat_statements'
pgaudit.log = 'ddl,role,write'
pgaudit.log_relation = on
pgaudit.log_parameter = off
pgaudit.log_catalog = off

password_encryption = 'scram-sha-256'
log_connections = on
log_disconnections = on
log_statement = 'none'
