# Terraform for infra/ (Google Cloud, europe-west2; ADR-0098): static checks on every pull request
# that touches infrastructure, a dev plan posted to the pull request, a dev apply from main, and
# the dev images built, pushed to Artifact Registry and released after the apply.
#
# Google Cloud access is by Workload Identity Federation only (no JSON keys), set up by a person in
# infra/bootstrap. Each job names a GitHub environment, and each Google Cloud account trusts one
# environment's subject only: dev-plan (the read-only plan), dev (the apply) and dev-release (the
# release). Protect those environments in GitHub (deployment branches; required reviewers for
# staging and prod). A deny policy keeps every CI account away from secret values, data and logs.
# Until Brian applies the bootstrap and sets the GCP_* repository variables, the plan, apply and
# release jobs skip cleanly. See infra/README.md for the variables this workflow reads.

name: Terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TF_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  GCP_REGION: europe-west2

jobs:
  static:
    name: Format, validate, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive -diff

      - name: terraform init and validate (bootstrap, dev, staging, prod)
        working-directory: infra
        run: |
          for root in bootstrap envs/dev envs/staging envs/prod; do
            echo "::group::${root}"
            terraform -chdir="${root}" init -backend=false -lockfile=readonly
            terraform -chdir="${root}" validate
            echo "::endgroup::"
          done

      - name: terraform test (plans against mocked providers)
        working-directory: infra
        run: |
          for dir in modules/harbour_stack modules/github_wif bootstrap; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false
            terraform -chdir="${dir}" test
            echo "::endgroup::"
          done

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('infra/.tflint.hcl') }}

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "${GITHUB_WORKSPACE}/infra/.tflint.hcl"
          for root in bootstrap envs/dev envs/staging envs/prod; do
            echo "::group::${root}"
            tflint --chdir="${root}" --config "${GITHUB_WORKSPACE}/infra/.tflint.hcl" --format=compact
            echo "::endgroup::"
          done

  security:
    name: Trivy configuration scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Trivy (misconfigurations, HIGH and CRITICAL fail the build)
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.67.2 config \
            --severity HIGH,CRITICAL --exit-code 1 infra

  gcp-gate:
    name: Check for Google Cloud access
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          DEPLOY_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_DEV }}
        run: |
          if [ -n "${PROVIDER}" ] && [ -n "${DEPLOY_ACCOUNT}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::GCP_WORKLOAD_IDENTITY_PROVIDER_DEV or GCP_DEPLOY_SERVICE_ACCOUNT_DEV is not set, so plan, apply and release are skipped. Brian creates the dev project and runs the bootstrap (infra/README.md; docs/plans/human-actions.md)."
          fi

  plan-dev:
    name: Plan dev
    # Never for a pull request from a fork.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.gcp-gate.outputs.enabled == 'true'
    needs: [static, security, gcp-gate]
    runs-on: ubuntu-latest
    # The plan account trusts this environment's subject only.
    environment: dev-plan
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID_DEV }}
      DOMAIN_NAME: ${{ vars.DEV_DOMAIN_NAME }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET_DEV }}
      DNS_ZONE_NAME: ${{ vars.DEV_DNS_ZONE_NAME }}
      ALERT_EMAILS: ${{ vars.DEV_ALERT_EMAILS }}
      BILLING_ACCOUNT_ID: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
    steps:
      - name: Check for the plan account
        id: account
        env:
          PLAN_ACCOUNT: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT_DEV }}
        run: |
          if [ -n "${PLAN_ACCOUNT}" ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::GCP_PLAN_SERVICE_ACCOUNT_DEV is not set (terraform output plan_service_account after the first apply), so the plan is skipped."
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
        if: steps.account.outputs.present == 'true'

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        if: steps.account.outputs.present == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Pull requests impersonate the read-only plan account, which trusts only the
      # pull_request subject of this repository and cannot read secrets or data.
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        if: steps.account.outputs.present == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT_DEV }}

      - name: Prepare dev backend and inputs
        if: steps.account.outputs.present == 'true'
        run: bash infra/scripts/ci-terraform-env.sh dev

      - name: terraform plan
        if: steps.account.outputs.present == 'true'
        working-directory: infra/envs/dev
        run: |
          terraform init -backend-config=backend.hcl -lockfile=readonly
          terraform plan -lock=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Post the plan to the pull request
        if: steps.account.outputs.present == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- harbour-terraform-plan-dev -->";
            let plan = fs.readFileSync("infra/envs/dev/plan.txt", "utf8");
            const limit = 60000;
            if (plan.length > limit) {
              plan = `${plan.slice(0, limit)}\n\n(Plan truncated; the full plan is in the workflow log.)`;
            }
            const body = `${marker}\n### Terraform plan: dev\n\n<details><summary>Show plan</summary>\n\n\`\`\`text\n${plan}\n\`\`\`\n\n</details>\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply-dev:
    name: Apply dev
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.gcp-gate.outputs.enabled == 'true'
    needs: [static, security, gcp-gate]
    runs-on: ubuntu-latest
    # The apply account trusts repo:<owner>/<repo>:environment:dev only; the environment's
    # deployment branch rule admits main.
    environment: dev
    concurrency:
      group: terraform-apply-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID_DEV }}
      DOMAIN_NAME: ${{ vars.DEV_DOMAIN_NAME }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET_DEV }}
      DNS_ZONE_NAME: ${{ vars.DEV_DNS_ZONE_NAME }}
      ALERT_EMAILS: ${{ vars.DEV_ALERT_EMAILS }}
      BILLING_ACCOUNT_ID: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      RELEASE_SERVICE_ACCOUNT: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT_DEV }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_DEV }}

      - name: Prepare dev backend and inputs
        run: bash infra/scripts/ci-terraform-env.sh dev

      - name: terraform plan and apply
        working-directory: infra/envs/dev
        run: |
          terraform init -backend-config=backend.hcl -lockfile=readonly
          terraform plan -no-color -out=tfplan
          terraform apply -no-color tfplan

  # Builds the api and web images before signing in, so no credential is in the build context
  # while dependencies install; then signs in as the release account (no credentials file),
  # pushes them to Artifact Registry under the commit SHA (tags are immutable), runs the migration
  # job with the new api image, and releases the services. Terraform ignores the services' images
  # after the first apply, so this job owns them from then on.
  release-dev:
    name: Build, push and release dev
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.gcp-gate.outputs.enabled == 'true'
    needs: [apply-dev, gcp-gate]
    runs-on: ubuntu-latest
    # The release account trusts repo:<owner>/<repo>:environment:dev-release only.
    environment: dev-release
    concurrency:
      group: release-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID_DEV }}
      PREFIX: harbour-dev
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Build the api and web images (no credentials yet)
        run: |
          repo="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/harbour"
          for app in api web; do
            docker build -f "apps/${app}/Dockerfile" -t "${repo}/${app}:${GITHUB_SHA}" .
          done

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT_DEV }}
          token_format: access_token
          create_credentials_file: false

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Push the images
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          repo="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/harbour"
          printf '%s' "${TOKEN}" | docker login -u oauth2accesstoken --password-stdin "https://${GCP_REGION}-docker.pkg.dev"
          for app in api web; do
            docker push "${repo}/${app}:${GITHUB_SHA}"
          done
          docker logout "https://${GCP_REGION}-docker.pkg.dev"

      - name: Run the migrations, then release
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID_DEV }}
        run: |
          repo="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/harbour"
          gcloud run jobs update "${PREFIX}-migrate" --region "${GCP_REGION}" --image "${repo}/api:${GITHUB_SHA}" --quiet
          gcloud run jobs execute "${PREFIX}-migrate" --region "${GCP_REGION}" --wait
          gcloud run services update "${PREFIX}-api" --region "${GCP_REGION}" --container main --image "${repo}/api:${GITHUB_SHA}" --update-env-vars "APP_VERSION=${GITHUB_SHA}" --quiet
          gcloud run services update "${PREFIX}-worker" --region "${GCP_REGION}" --container main --image "${repo}/api:${GITHUB_SHA}" --update-env-vars "APP_VERSION=${GITHUB_SHA}" --quiet
          gcloud run services update "${PREFIX}-web" --region "${GCP_REGION}" --container main --image "${repo}/web:${GITHUB_SHA}" --quiet
