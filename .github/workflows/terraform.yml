# Terraform for infra/ (Google Cloud, europe-west2; ADR-0098): static checks on every pull request
# that touches infrastructure, a dev plan posted to the pull request, a dev apply from main, and
# the dev images built, pushed to Artifact Registry and released after the apply.
#
# Google Cloud access is by Workload Identity Federation only (no JSON keys): pull requests
# impersonate the read-only plan account, pushes to main the deploy account. Until Brian creates
# the dev project and sets the GCP_* repository variables, the plan, apply and release jobs skip
# cleanly. See infra/README.md for the variables this workflow reads.

name: Terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TF_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  GCP_REGION: europe-west2

jobs:
  static:
    name: Format, validate, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive -diff

      - name: terraform init and validate (dev, staging, prod)
        working-directory: infra/envs
        run: |
          for env in dev staging prod; do
            echo "::group::${env}"
            terraform -chdir="${env}" init -backend=false -lockfile=readonly
            terraform -chdir="${env}" validate
            echo "::endgroup::"
          done

      - name: terraform test (stack plan against mocked providers)
        working-directory: infra/modules/harbour_stack
        run: |
          terraform init -backend=false
          terraform test

      - uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('infra/.tflint.hcl') }}

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "${GITHUB_WORKSPACE}/infra/.tflint.hcl"
          for env in dev staging prod; do
            echo "::group::${env}"
            tflint --chdir="envs/${env}" --config "${GITHUB_WORKSPACE}/infra/.tflint.hcl" --format=compact
            echo "::endgroup::"
          done

  security:
    name: Trivy configuration scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Trivy (misconfigurations, HIGH and CRITICAL fail the build)
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.67.2 config \
            --severity HIGH,CRITICAL --exit-code 1 infra

  gcp-gate:
    name: Check for Google Cloud access
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          DEPLOY_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_DEV }}
        run: |
          if [ -n "${PROVIDER}" ] && [ -n "${DEPLOY_ACCOUNT}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::GCP_WORKLOAD_IDENTITY_PROVIDER_DEV or GCP_DEPLOY_SERVICE_ACCOUNT_DEV is not set, so plan, apply and release are skipped. Brian creates the dev project and runs the bootstrap (infra/README.md; docs/plans/human-actions.md)."
          fi

  plan-dev:
    name: Plan dev
    if: github.event_name == 'pull_request' && needs.gcp-gate.outputs.enabled == 'true'
    needs: [static, security, gcp-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID_DEV }}
      DOMAIN_NAME: ${{ vars.DEV_DOMAIN_NAME }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET_DEV }}
      DNS_ZONE_NAME: ${{ vars.DEV_DNS_ZONE_NAME }}
      ALERT_EMAILS: ${{ vars.DEV_ALERT_EMAILS }}
      BILLING_ACCOUNT_ID: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
    steps:
      - name: Check for the plan account
        id: account
        env:
          PLAN_ACCOUNT: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT_DEV }}
        run: |
          if [ -n "${PLAN_ACCOUNT}" ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::GCP_PLAN_SERVICE_ACCOUNT_DEV is not set (terraform output plan_service_account after the first apply), so the plan is skipped."
          fi

      - uses: actions/checkout@v5
        if: steps.account.outputs.present == 'true'

      - uses: hashicorp/setup-terraform@v3
        if: steps.account.outputs.present == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Pull requests impersonate the read-only plan account, which trusts only the
      # pull_request subject of this repository and cannot read secrets or data.
      - uses: google-github-actions/auth@v2
        if: steps.account.outputs.present == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT_DEV }}

      - name: Prepare dev backend and inputs
        if: steps.account.outputs.present == 'true'
        run: bash infra/scripts/ci-terraform-env.sh dev

      - name: terraform plan
        if: steps.account.outputs.present == 'true'
        working-directory: infra/envs/dev
        run: |
          terraform init -backend-config=backend.hcl -lockfile=readonly
          terraform plan -lock=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Post the plan to the pull request
        if: steps.account.outputs.present == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- harbour-terraform-plan-dev -->";
            let plan = fs.readFileSync("infra/envs/dev/plan.txt", "utf8");
            const limit = 60000;
            if (plan.length > limit) {
              plan = `${plan.slice(0, limit)}\n\n(Plan truncated; the full plan is in the workflow log.)`;
            }
            const body = `${marker}\n### Terraform plan: dev\n\n<details><summary>Show plan</summary>\n\n\`\`\`text\n${plan}\n\`\`\`\n\n</details>\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply-dev:
    name: Apply dev
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.gcp-gate.outputs.enabled == 'true'
    needs: [static, security, gcp-gate]
    runs-on: ubuntu-latest
    # No GitHub `environment:` here on purpose: it would change the token subject to
    # repo:<owner>/<repo>:environment:dev, which the deploy account does not trust.
    concurrency:
      group: terraform-apply-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID_DEV }}
      DOMAIN_NAME: ${{ vars.DEV_DOMAIN_NAME }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET_DEV }}
      DNS_ZONE_NAME: ${{ vars.DEV_DNS_ZONE_NAME }}
      ALERT_EMAILS: ${{ vars.DEV_ALERT_EMAILS }}
      BILLING_ACCOUNT_ID: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_DEV }}

      - name: Prepare dev backend and inputs
        run: bash infra/scripts/ci-terraform-env.sh dev

      - name: terraform plan and apply
        working-directory: infra/envs/dev
        run: |
          terraform init -backend-config=backend.hcl -lockfile=readonly
          terraform plan -no-color -out=tfplan
          terraform apply -no-color tfplan

  # Builds the api and web images, pushes them to Artifact Registry under the commit SHA (tags
  # are immutable), runs the migration job with the new api image, then releases the services.
  # Terraform ignores images after the first apply, so this job owns them from then on.
  release-dev:
    name: Build, push and release dev
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.gcp-gate.outputs.enabled == 'true'
    needs: [apply-dev, gcp-gate]
    runs-on: ubuntu-latest
    concurrency:
      group: release-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID_DEV }}
      PREFIX: harbour-dev
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_DEV }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Artifact Registry
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: printf '%s' "${TOKEN}" | docker login -u oauth2accesstoken --password-stdin "https://${GCP_REGION}-docker.pkg.dev"

      - name: Build and push the api and web images
        run: |
          repo="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/harbour"
          for app in api web; do
            docker build -f "apps/${app}/Dockerfile" -t "${repo}/${app}:${GITHUB_SHA}" .
            docker push "${repo}/${app}:${GITHUB_SHA}"
          done

      - name: Run the migrations, then release
        run: |
          repo="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/harbour"
          gcloud run jobs update "${PREFIX}-migrate" --region "${GCP_REGION}" --image "${repo}/api:${GITHUB_SHA}" --quiet
          gcloud run jobs execute "${PREFIX}-migrate" --region "${GCP_REGION}" --wait
          gcloud run services update "${PREFIX}-api" --region "${GCP_REGION}" --container main --image "${repo}/api:${GITHUB_SHA}" --update-env-vars "APP_VERSION=${GITHUB_SHA}" --quiet
          gcloud run services update "${PREFIX}-worker" --region "${GCP_REGION}" --container main --image "${repo}/api:${GITHUB_SHA}" --update-env-vars "APP_VERSION=${GITHUB_SHA}" --quiet
          gcloud run services update "${PREFIX}-web" --region "${GCP_REGION}" --container main --image "${repo}/web:${GITHUB_SHA}" --quiet
