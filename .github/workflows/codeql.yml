name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    name: CodeQL (JavaScript and TypeScript)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          # Code scanning is not enabled on the repository yet (human action H-17), so results
          # stay here: gate on high and critical findings and keep the SARIF as an artifact.
          upload: never
          output: codeql-results
      - name: High and critical security findings fail the build
        run: node scripts/check-sarif.mjs codeql-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 30
