name: codeql

# Pull requests that change code, each merge to main (the baseline pull request alerts compare
# against) and a weekly run over main.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyse:
    name: CodeQL (JavaScript and TypeScript)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: code
        name: Skip a change to documentation only
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # The check still reports, so it can stay a required status check.
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null \
            && ! git diff --name-only "$BASE" HEAD | grep -qvE '^(docs/|.*\.md$)'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Documentation only: no code to analyse."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: github/codeql-action/init@v3
        if: steps.code.outputs.changed == 'true'
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        if: steps.code.outputs.changed == 'true'
        with:
          category: "/language:javascript-typescript"
          # Results go to the Security tab as code-scanning alerts (H-17; the repository is public).
          # A pull request from a fork or from Dependabot gets a read-only token, so its results
          # stay in the artifact; the gate below runs either way.
          upload: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && 'always' || 'never' }}
          output: codeql-results
      - name: High and critical security findings fail the build
        if: steps.code.outputs.changed == 'true'
        run: node scripts/check-sarif.mjs codeql-results
      - uses: actions/upload-artifact@v4
        if: always() && steps.code.outputs.changed == 'true'
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 30
