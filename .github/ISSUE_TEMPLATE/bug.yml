name: Bug
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never include real people's details. Use the demo tenant or invented data."
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: dropdown
    id: safety
    attributes:
      label: Could this affect someone's care?
      options: ["No", "Possibly", "Yes - tell the Clinical Safety Officer now"]
    validations:
      required: true
