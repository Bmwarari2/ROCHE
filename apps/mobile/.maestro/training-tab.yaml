# Training under More (slice 72 leftover, H-1365; ADR-0138 moved it from its own tab): a member with
# their own training reaches it from More; the Settings link stays as a second way in
# (training-offline.yaml). Needs the live API stack and a test member holding the training self
# permission. Not yet run on a device or emulator.
appId: uk.co.thapsus.harbour
name: Training reached from More
---
- runFlow: sign-in.yaml
- runFlow:
    file: open-more.yaml
    env:
      DESTINATION: "training"
- extendedWaitUntil:
    visible:
      id: "training-screen"
    timeout: 15000
