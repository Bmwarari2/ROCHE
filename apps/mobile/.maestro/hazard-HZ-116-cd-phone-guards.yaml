# Hazard HZ-116 (a two-person check not genuinely done), Phase 2 slice 70: a member who may not
# record controlled drugs is told so as the dose opens, before any check, and cannot reach signing;
# a conflict on a controlled drug is never decided on the phone.
#
# Needs the live API stack; HARBOUR_CD_MEDICINE is a controlled drug due now on the MAR of a person
# the test member is assigned to, the member does not hold medicines.cd.administer, and a conflict
# on that medicine has been seeded through the API. Written for slice 70; not yet run here.
appId: uk.co.thapsus.harbour
name: Controlled drugs on the phone are guarded before the dose
tags:
  - medicines
env:
  HARBOUR_CD_MEDICINE: ${HARBOUR_CD_MEDICINE || "Morphine"}
---
- runFlow: sign-in.yaml
- extendedWaitUntil:
    visible:
      text: "Up to date.*"
    timeout: 60000
- tapOn:
    id: "tab-medicines"
- tapOn:
    text: ".*${HARBOUR_CD_MEDICINE}.*"
- tapOn:
    text: "${HARBOUR_CD_MEDICINE}.*"
- assertVisible:
    id: "cd-not-permitted"
- assertVisible:
    text: "You cannot give or record controlled drugs.*"
- tapOn: "Given"
- assertNotVisible:
    id: "cd-signatures"
- back
- back
- tapOn: "Doses recorded on two phones"
- extendedWaitUntil:
    visible:
      text: "This is a controlled drug.*"
    timeout: 30000
- assertNotVisible: "Same dose sent twice: the first record stands"
- assertNotVisible: "What you found out"
# At a care home (a witness is required) a member who may record controlled drugs never sees the
# lone-worker option. Set HARBOUR_CD_RECORDER_FLOW to run this part as such a member.
