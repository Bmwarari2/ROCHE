# Secret scanning (section 5.3). Extends the default rules; the allowlists cover documented local-only
# defaults that are never used outside a developer's machine or CI, and names that are never secrets.
[extend]
useDefault = true

[[allowlists]]
description = "Local and CI-only defaults"
paths = [
  '''pnpm-lock\.yaml''',
  '''apps/api/openapi\.json''',
]
regexes = [
  # Lowercase identifiers joined by dots or underscores (rate-table keys, permission names, tool
  # keys such as nmw.hourly.21_plus or ng249_falls_question) trip the generic-api-key rule by
  # entropy; they are names, never secrets. Provider tokens have their own rules and mixed case.
  '''^[a-z][a-z0-9]*([._][a-z0-9]+)+$''',
  '''harbour_[a-z]+_local''',
  '''harbour_admin_ci''',
  '''local-development-secret-change-me-[0-9]+''',
]

[[allowlists]]
# Message catalogue keys such as care.refusal.scale2Clinician are dotted camelCase names. The
# generic-api-key rule fires when the previous message contains "api" (as in "therapist") and takes
# the next key for a secret. Both conditions must hold: the file is a catalogue and the match is a
# whole dotted name, so a token elsewhere, or a secret-shaped value inside a catalogue, is still
# reported. (gitleaks 8.28 does not apply targetRules to the extended default rules.)
description = "Message catalogue keys"
condition = "AND"
paths = ['''^packages/i18n/src/messages/[a-zA-Z.-]+\.json$''']
regexes = ['''^[a-z][a-zA-Z0-9]*(\.[a-zA-Z0-9]+)+$''']
